name: Build IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)"
      - name: Build unsigned IPA
        run: ./build_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ApneaTrainer-ipa
          path: ApneaTrainer.ipa
